<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Nossa Dieta">
<title>Nossa Dieta</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cdefs%3E%3ClinearGradient id='g' x1='0' y1='0' x2='1' y2='1'%3E%3Cstop offset='0' stop-color='%2330D158'/%3E%3Cstop offset='1' stop-color='%230A84FF'/%3E%3C/linearGradient%3E%3C/defs%3E%3Crect width='64' height='64' rx='16' fill='url(%23g)'/%3E%3Cpath d='M20 42c0-12 9-21 24-23-1 15-10 25-22 25' fill='%23fff' opacity='.9'/%3E%3C/svg%3E">
<style>
:root{
  --bg:#000; --card:rgba(38,38,42,.58); --card-b:rgba(255,255,255,.07); --solid:#1C1C1E; --solid2:#2C2C2E;
  --fill:rgba(118,118,128,.24); --fill2:rgba(118,118,128,.13);
  --ink:#FFFFFF; --muted:rgba(235,235,245,.62); --muted2:rgba(235,235,245,.32); --sep:rgba(255,255,255,.09);
  --green:#30D158; --green-soft:rgba(48,209,88,.16); --warn:#FF9F0A; --warn-soft:rgba(255,159,10,.16);
  --danger:#FF453A; --danger-soft:rgba(255,69,58,.16); --water:#64D2FF; --cyan:#64D2FF;
  --bar:rgba(28,28,32,.55); --bar-b:rgba(255,255,255,.12); --sheet:rgba(30,30,34,.86); --optbg:rgba(255,255,255,.06);
  --glow1:.30; --glow2:.16;
  --acc:#0A84FF; --acc-soft:rgba(10,132,255,.18); --acc-ink:#fff;
  --E:#0A84FF; --E-soft:rgba(10,132,255,.18); --T:#FF375F; --T-soft:rgba(255,55,95,.18);
  --r:24px; --blur:saturate(170%) blur(22px);
}
:root[data-theme=light]{
  --bg:#EEF0F5; --card:rgba(255,255,255,.66); --card-b:rgba(255,255,255,.75); --solid:#FFFFFF; --solid2:#FFFFFF;
  --fill:rgba(118,118,128,.13); --fill2:rgba(118,118,128,.08);
  --ink:#000; --muted:rgba(60,60,67,.62); --muted2:rgba(60,60,67,.3); --sep:rgba(60,60,67,.12);
  --green:#34C759; --green-soft:rgba(52,199,89,.14); --warn:#FF9500; --warn-soft:rgba(255,149,0,.14);
  --danger:#FF3B30; --danger-soft:rgba(255,59,48,.12); --water:#32ADE6; --cyan:#32ADE6;
  --bar:rgba(255,255,255,.6); --bar-b:rgba(255,255,255,.85); --sheet:rgba(242,242,247,.9); --optbg:rgba(255,255,255,.8);
  --glow1:.22; --glow2:.14;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Helvetica Neue",Inter,system-ui,sans-serif;letter-spacing:-.01em;-webkit-font-smoothing:antialiased}
body{min-height:100vh}
.bgfx{position:fixed;inset:0;z-index:-1;pointer-events:none;
  background:
    radial-gradient(60% 45% at 10% -5%, color-mix(in srgb,var(--acc) calc(var(--glow1)*100%),transparent) 0%, transparent 70%),
    radial-gradient(55% 40% at 105% 35%, color-mix(in srgb,#BF5AF2 calc(var(--glow2)*100%),transparent) 0%, transparent 70%),
    radial-gradient(60% 40% at 0% 100%, color-mix(in srgb,var(--cyan) calc(var(--glow2)*100%),transparent) 0%, transparent 70%),
    var(--bg)}
button,input,select,textarea{font:inherit;color:inherit;letter-spacing:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
button:active{opacity:.72}
h1,h2,h3{margin:0;line-height:1.15;letter-spacing:-.02em}
.wrap{max-width:560px;margin:0 auto;padding:0 16px}
header.top{position:sticky;top:0;z-index:20;background:var(--bar);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);border-bottom:.5px solid var(--sep);padding-top:env(safe-area-inset-top)}
.topin{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:9px 0}
.brand{font-weight:650;font-size:16px;display:flex;align-items:center;gap:8px}
.brand i{width:28px;height:28px;border-radius:50%;background:var(--acc);background:linear-gradient(145deg,var(--acc),color-mix(in srgb,var(--acc) 50%,#000));display:inline-grid;place-items:center;font-style:normal;font-size:14px}
.seg{display:flex;background:var(--fill);border-radius:999px;padding:2px}
.seg button{padding:6px 15px;border-radius:999px;font-weight:600;font-size:14px;color:var(--muted);transition:.25s}
.seg button.on{background:var(--solid2);color:var(--ink);box-shadow:0 3px 10px rgba(0,0,0,.2)}
.seg button.on.E{color:var(--E)} .seg button.on.T{color:var(--T)}
main{padding:4px 0 calc(118px + env(safe-area-inset-bottom))}
/* tab bar flutuante */
nav.bot{position:fixed;left:12px;right:12px;bottom:calc(10px + env(safe-area-inset-bottom));z-index:30;max-width:520px;margin:0 auto;
  background:var(--bar);backdrop-filter:saturate(180%) blur(28px);-webkit-backdrop-filter:saturate(180%) blur(28px);
  border:.5px solid var(--bar-b);border-radius:34px;box-shadow:0 12px 34px rgba(0,0,0,.32),inset 0 1px 0 rgba(255,255,255,.06)}
nav.bot .in{display:flex;justify-content:space-between;padding:6px}
nav.bot button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:7px 0 6px;font-size:10.5px;font-weight:600;color:var(--muted);border-radius:26px;transition:background .25s,color .25s}
nav.bot button svg{width:24px;height:24px;transition:transform .25s}
nav.bot button.on{color:var(--acc);background:var(--fill2)}
nav.bot button.on svg{transform:scale(1.06)}
/* títulos */
.lthead{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;margin:16px 2px 16px}
.eyebrow{font-size:13px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.02em;margin-bottom:2px}
.lt{font-size:34px;font-weight:700;letter-spacing:-.025em}
.lt.cap{text-transform:capitalize}
.circ{width:36px;height:36px;border-radius:50%;background:var(--fill);display:grid;place-items:center;color:var(--acc);font-size:20px;font-weight:600;flex:0 0 auto}
.circ:disabled{opacity:.3}
/* cards de vidro */
.card,.stat,details.day,.banner{background:var(--card);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);border:.5px solid var(--card-b)}
.card{border-radius:var(--r);padding:16px;margin-bottom:14px}
.row{display:flex;align-items:center;gap:10px}
.between{display:flex;align-items:center;justify-content:space-between;gap:10px}
.muted{color:var(--muted)} .small{font-size:14px} .xs{font-size:12.5px} .b{font-weight:600}
.h3{font-size:19px;font-weight:700;letter-spacing:-.02em}
.pill{white-space:nowrap;display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:600;background:var(--fill);color:var(--muted)}
.pill.acc{background:var(--acc-soft);color:var(--acc)} .pill.warn{background:var(--warn-soft);color:var(--warn)}
.pill.green{background:var(--green-soft);color:var(--green)} .pill.E{background:var(--E-soft);color:var(--E)} .pill.T{background:var(--T-soft);color:var(--T)}
.btn{white-space:nowrap;display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:13px 20px;border-radius:999px;font-weight:600;background:var(--acc);color:var(--acc-ink);transition:transform .12s}
.btn:active{transform:scale(.97)}
.btn.sec{background:var(--fill);color:var(--ink)} .btn.ghost{background:transparent;color:var(--acc);padding:6px 8px}
.btn.danger{background:var(--danger-soft);color:var(--danger)} .btn.full{width:100%} .btn.sm{padding:8px 14px;font-size:14px}
.btn.green{background:var(--green);color:#fff}
.summary{display:grid;grid-template-columns:auto 1fr;gap:16px;align-items:center}
.ring{position:relative;width:92px;height:92px}
.ring svg{transform:rotate(-90deg)}
.ring span{position:absolute;inset:0;display:grid;place-items:center;font-weight:700;font-size:22px;letter-spacing:-.03em}
.water{display:flex;flex-direction:column;gap:7px}
.bar{height:8px;background:var(--fill);border-radius:99px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--water);border-radius:99px;transition:width .4s cubic-bezier(.2,.8,.2,1)}
.wbtns{display:flex;gap:6px;flex-wrap:wrap}
.wbtns .btn{padding:7px 12px;font-size:13px}
.meal .mh{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:4px}
.meal .time{font-weight:600;color:var(--acc);font-size:13px;font-variant-numeric:tabular-nums}
.meal .mh .row{gap:8px;align-items:baseline}
.sec-t{font-size:12px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);font-weight:600;margin:14px 0 2px}
.item{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:.5px solid var(--sep)}
.item:first-of-type,.sec-t+.item{border-top:0}
.chk{flex:0 0 28px;height:28px;border-radius:50%;border:2px solid var(--muted2);display:grid;place-items:center;transition:.18s}
.chk.on{background:var(--acc);border-color:var(--acc);color:var(--acc-ink);transform:scale(1.04)}
.chk svg{width:15px;height:15px;opacity:0}
.chk.on svg{opacity:1}
.it-main{flex:1;min-width:0}
.it-n{font-weight:500}
.item.done .it-n{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--muted2)}
.it-q{font-size:13.5px;color:var(--muted);margin-top:1px}
.swap{flex:0 0 auto;font-size:13px;font-weight:600;color:var(--acc);background:var(--acc-soft);padding:6px 12px;border-radius:999px}
.note{background:var(--fill2);border-radius:16px;padding:11px 14px;font-size:13.5px;color:var(--muted);margin-top:10px}
.banner{border-radius:20px;padding:13px 15px;font-size:14px;margin-bottom:14px;display:flex;gap:10px;align-items:flex-start;color:var(--muted)}
.banner b{color:var(--ink)}
.banner.warn{background:var(--warn-soft);color:var(--ink)}
textarea,input[type=text],input[type=number],input[type=date],input[type=search],select{width:100%;padding:12px 14px;border-radius:14px;border:0;background:var(--fill);outline:none;color:var(--ink);-webkit-appearance:none;appearance:none;min-height:46px}
input::placeholder,textarea::placeholder{color:var(--muted2)}
textarea:focus,input:focus,select:focus{box-shadow:0 0 0 2px var(--acc)}
input[type=date]{color-scheme:dark} :root[data-theme=light] input[type=date]{color-scheme:light}
textarea{min-height:84px;resize:vertical}
label.f{display:block;font-size:13px;font-weight:600;color:var(--muted);margin:0 0 6px 4px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin-bottom:14px}
.stat{border-radius:22px;padding:14px 16px}
.stat .v{font-size:26px;font-weight:700;letter-spacing:-.03em;margin-top:2px}
.stat .v small{font-size:15px;font-weight:600;color:var(--muted)}
.stat .l{font-size:13px;color:var(--muted);font-weight:500}
.list-row b{white-space:nowrap}
.list-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 0;border-top:.5px solid var(--sep)}
.list-row:first-child{border-top:0}
details.day{border-radius:var(--r);margin-bottom:12px;overflow:hidden}
details.day summary{list-style:none;padding:16px;display:flex;justify-content:space-between;align-items:center;font-weight:600;font-size:17px}
details.day summary::-webkit-details-marker{display:none}
details.day summary .chev{transition:.25s;color:var(--muted2);font-size:22px}
details.day[open] summary .chev{transform:rotate(90deg)}
.daybody{padding:0 16px 14px}
.chiprow{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:9px 0;border-top:.5px solid var(--sep)}
.sec-t+.chiprow{border-top:0}
.chip{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:999px;background:var(--fill);font-size:13.5px;font-weight:600;max-width:62%;text-align:right;color:var(--muted)}
.chip.sub,.chip.on{background:var(--acc-soft);color:var(--acc)}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:2px 0}
.chips::-webkit-scrollbar{display:none}
.chips .chip{max-width:none;flex:0 0 auto}
.cook-row{padding:12px 0;border-top:.5px solid var(--sep)}
.cook-row:first-of-type{border-top:0}
.split{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px}
.heat{display:grid;grid-template-columns:repeat(7,1fr);gap:7px}
.heat .h{position:relative;aspect-ratio:1;border-radius:50%;background:var(--fill2);display:grid;place-items:center;font-size:12.5px;font-weight:600;color:var(--muted)}
.heat .h.hd{background:transparent;aspect-ratio:auto;font-size:11px;color:var(--muted2)}
.heat .h.today{box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--ink)}
.heat .h.tr::after{content:"";position:absolute;bottom:-3px;width:6px;height:6px;border-radius:50%;background:var(--green);box-shadow:0 0 0 2px var(--bg)}
.legend{display:flex;gap:6px;align-items:center;font-size:11.5px;color:var(--muted);margin-top:12px;flex-wrap:wrap}
.legend i{width:11px;height:11px;border-radius:50%;display:inline-block}
.chart{width:100%;height:auto;display:block}
/* sheet */
.sheet{position:fixed;inset:0;z-index:50}
.sheet.hidden{display:none}
.backdrop{position:absolute;inset:0;background:rgba(0,0,0,.45);animation:fade .25s}
.panel{position:absolute;left:0;right:0;bottom:0;max-height:90vh;background:var(--sheet);backdrop-filter:saturate(180%) blur(30px);-webkit-backdrop-filter:saturate(180%) blur(30px);border-radius:30px 30px 0 0;border-top:.5px solid var(--bar-b);display:flex;flex-direction:column;animation:up .34s cubic-bezier(.2,.9,.25,1);max-width:560px;margin:0 auto;overflow:hidden}
.panel .ph{padding:8px 18px 12px}
.panel .ph h2{font-size:22px;font-weight:700}
.panel .grab{width:36px;height:5px;border-radius:9px;background:var(--muted2);margin:0 auto 12px}
.panel .pb{overflow:auto;padding:4px 18px calc(22px + env(safe-area-inset-bottom))}
.panel .circ{color:var(--muted);font-size:15px}
.panel .card{background:var(--optbg);backdrop-filter:none;-webkit-backdrop-filter:none}
.opt{display:flex;align-items:center;justify-content:space-between;gap:12px;width:100%;text-align:left;background:var(--optbg);border-radius:18px;padding:13px 15px;margin-bottom:8px}
.opt.cur{box-shadow:inset 0 0 0 2px var(--acc)}
.opt .on{font-weight:600}
.opt .og{font-weight:700;white-space:nowrap;color:var(--acc)}
.gh{font-size:12px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);font-weight:600;margin:16px 4px 8px}
#toast{position:fixed;left:50%;bottom:calc(100px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(16px) scale(.96);background:var(--solid2);color:var(--ink);padding:11px 18px;border-radius:999px;font-size:14px;font-weight:600;opacity:0;pointer-events:none;transition:.3s cubic-bezier(.2,.9,.25,1);z-index:60;max-width:90vw;text-align:center;box-shadow:0 10px 30px rgba(0,0,0,.35)}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0) scale(1)}
.welcome{min-height:82vh;display:flex;flex-direction:column;justify-content:center;gap:12px;text-align:center}
.welcome h1{font-size:34px;font-weight:700}
.welcome .big{display:flex;flex-direction:column;gap:12px;margin-top:18px}
.welcome .big button{padding:18px;border-radius:999px;font-size:18px;font-weight:600;color:#fff}
.toggle{display:flex;align-items:center;gap:12px;background:var(--optbg);border-radius:16px;padding:12px 14px;margin-bottom:10px;font-size:15px}
.toggle input{width:22px;height:22px;accent-color:var(--acc)}
.tabs2{display:flex;gap:0;margin-bottom:16px;background:var(--fill);border-radius:999px;padding:2px}
.tabs2 button{flex:1;padding:8px 6px;border-radius:999px;font-weight:600;font-size:14px;color:var(--muted);transition:.25s}
.tabs2 button.on{background:var(--solid2);color:var(--ink);box-shadow:0 3px 10px rgba(0,0,0,.2)}
.swatches{display:flex;flex-wrap:wrap;gap:12px;margin-top:4px}
.swatch{width:38px;height:38px;border-radius:50%;position:relative;transition:transform .15s}
.swatch.on{box-shadow:0 0 0 3px var(--solid),0 0 0 5px currentColor;transform:scale(1.05)}
.swatch.on::after{content:"";position:absolute;inset:0;margin:auto;width:12px;height:12px;border-radius:50%;background:#fff}
.set-t{font-size:15px;font-weight:600;margin:4px 0 10px}
.minidate{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:14px}
.minidate b{text-transform:capitalize}
/* treino */
.wk-hero{display:flex;gap:14px;align-items:center}
.wk-badge{width:58px;height:58px;border-radius:50%;display:grid;place-items:center;font-size:24px;font-weight:800;color:var(--acc-ink);background:var(--acc);background:linear-gradient(145deg,var(--acc),color-mix(in srgb,var(--acc) 55%,#000));flex:0 0 auto;box-shadow:0 8px 20px color-mix(in srgb,var(--acc) 35%,transparent)}
.wchips{display:flex;gap:8px;margin-top:14px}
.wchip{flex:1;height:44px;border-radius:999px;background:var(--fill);font-weight:700;color:var(--muted);position:relative}
.wchip.on{background:var(--acc);color:var(--acc-ink)}
.wchip.done::after{content:"";position:absolute;top:5px;right:9px;width:7px;height:7px;border-radius:50%;background:var(--green)}
.ex-h{display:flex;gap:12px;align-items:flex-start}
.ex-n{font-weight:650;font-size:16.5px;letter-spacing:-.015em}
.ex-num{width:30px;height:30px;border-radius:50%;background:var(--fill);display:grid;place-items:center;font-size:13px;font-weight:700;color:var(--muted);flex:0 0 auto}
.ex-num.ok{background:var(--green);color:#fff}
.sets{margin-top:12px;display:flex;flex-direction:column;gap:7px}
.setrow{display:grid;grid-template-columns:52px 1fr 1fr 36px;gap:8px;align-items:center}
.setrow input{min-height:40px;padding:8px 10px;text-align:center;border-radius:12px;font-variant-numeric:tabular-nums}
.setrow .sl{font-size:12.5px;color:var(--muted);font-weight:600}
.setrow .chk{width:32px;height:32px;flex-basis:32px}
.sethead{display:grid;grid-template-columns:52px 1fr 1fr 36px;gap:8px;font-size:11px;color:var(--muted2);text-transform:uppercase;font-weight:700;letter-spacing:.04em;text-align:center}
.hint{font-size:12.5px;color:var(--muted);margin-top:6px;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.tip{font-size:13.5px;color:var(--muted);background:var(--fill2);border-radius:14px;padding:10px 12px;margin-top:10px}
#timer{position:fixed;left:50%;bottom:calc(96px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(30px);opacity:0;pointer-events:none;z-index:35;
  display:flex;align-items:center;gap:12px;padding:8px 8px 8px 18px;border-radius:999px;background:var(--bar);backdrop-filter:saturate(180%) blur(28px);-webkit-backdrop-filter:saturate(180%) blur(28px);border:.5px solid var(--bar-b);box-shadow:0 10px 30px rgba(0,0,0,.35);overflow:hidden;transition:.3s cubic-bezier(.2,.9,.25,1)}
#timer.show{opacity:1;transform:translateX(-50%);pointer-events:auto}
#timer span{font-size:13px;color:var(--muted);font-weight:600}
#timer b{font-size:22px;font-variant-numeric:tabular-nums;min-width:56px}
#timer button{white-space:nowrap;height:34px;padding:0 12px;border-radius:999px;background:var(--fill);font-weight:600;font-size:13px}
#timer i{position:absolute;left:0;bottom:0;height:3px;background:var(--acc);transition:width .25s linear}
/* anéis */
.rings{display:grid;grid-template-columns:auto 1fr;gap:18px;align-items:center}
.rl{display:flex;flex-direction:column;gap:10px}
.rl div{display:flex;flex-direction:column}
.rl b{font-size:20px;letter-spacing:-.02em}
.rl span{font-size:12.5px;font-weight:600;text-transform:uppercase;letter-spacing:.03em}
.bars7{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;align-items:end;height:120px;margin-top:8px}
.bars7 .bc{display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end}
.bars7 .bt{height:84px;width:100%;display:flex;align-items:flex-end;justify-content:center}
.bars7 .bv{width:100%;max-width:26px;border-radius:999px;background:var(--acc);min-height:6px;transition:height .4s}
.bars7 .bv.empty{background:var(--fill)}
.bars7 .bl{font-size:11px;color:var(--muted);font-weight:600}

function pd(s){ const [y,m,d]=s.split('-').map(Number); return new Date(y,m-1,d); }
function addDays(s,n){ const d=pd(s); d.setDate(d.getDate()+n); return ds(d); }
function weekStart(s){ const dw=(pd(s).getDay()+6)%7; return addDays(s,-dw); }

function subOf(k,u,d){ const L=getDay(d,u); if(L.subs && k in L.subs) return L.subs[k]; const w=S.week[pd(d).getDay()]; return (w && w[k]) || null; }
function options(it, g){
  if(it.grp==='hortA') return [{gh:'Hortaliças tipo A (≈5 kcal/porção)', list:HORT_A.map(n=>({n, g, ref:'mesma quantidade'}))}];
  if(it.grp==='hortAB') return [{gh:'Hortaliças tipo A (≈5 kcal/porção)', list:HORT_A.map(n=>({n, g, ref:'mesma quantidade'}))},{gh:'Hortaliças tipo B (≈10 kcal/porção)', list:HORT_B.map(([n])=>({n, g, ref:'mesma quantidade'}))}];
  const G=GROUPS[it.grp]; const p=g/it.refG;
  return [{gh:G.n+' · '+G.k, list:G.f.map(f=>({n:f.n, s:f.s, g:rnd(p*f.g), ref:'1 porção = '+f.m+' ('+num(f.g)+' g)'}))}];
}
function findOpt(it,g,name){ for(const grp of options(it,g)) for(const o of grp.list) if(o.n===name) return o; return null; }
function eff(it,u,d){
  const g = it.g ? it.g[u] : null;
  const sub = it.grp ? subOf(it.k,u,d) : null;
  if(sub){ const o=findOpt(it,g,sub); if(o) return {n:o.n, g:o.g, s:o.s, sub:true, orig:it.n}; }
  return {n:it.n, g, m:it.m?it.m[u]:null, sub:false, liquid:it.liquid};
}

function sessW(d,u){ S.train[d]=S.train[d]||{}; if(!S.train[d][u]) S.train[d][u]={w:suggestW(u), sets:{}, cardio:null, done:false}; return S.train[d][u]; }
function trained(d,u){ const s=getSess(d,u); return !!(s && (s.done || Object.values(s.sets||{}).some(a=>a.some(x=>x&&x.ok)) || (s.cardio&&s.cardio.ok))); }
function suggestW(u){
  const F=FICHAS[u]; const ds_=Object.keys(S.train).filter(d=>d<todayStr() && S.train[d][u] && trained(d,u)).sort();
  if(!ds_.length) return F.seq[0];
  const last=S.train[ds_[ds_.length-1]][u].w; const i=F.seq.indexOf(last); return F.seq[(i+1)%F.seq.length];
}

function lastPerf(u,ex,before){
  const dsx=Object.keys(S.train).filter(d=>d<before).sort().reverse();
  for(const d of dsx){ const s=S.train[d][u]; const a=s&&s.sets&&s.sets[ex]; if(a && a.some(z=>z&&(z.kg||z.r))) return {d, sets:a.filter(Boolean)}; }

}

function weekTrainStats(u, ref){
  const ws=weekStart(ref||todayStr()); let n=0, cmin=0;
  for(let i=0;i<7;i++){ const d=addDays(ws,i); if(trained(d,u)) n++; const s=getSess(d,u); if(s&&s.cardio&&s.cardio.ok) cmin+=Number(s.cardio.min)||0; }
  return {n, cmin};
}
function weekDietAvg(u, ref){ const ws=weekStart(ref||todayStr()); let s=0,c=0; for(let i=0;i<7;i++){ const d=addDays(ws,i); if(d>todayStr()) break; if(hasLog(d,u)){ s+=adherence(d,u).p; c++; } } return c?Math.round(s/c):0; }
function streak(u){ let d=todayStr(), n=0; if(!hasLog(d,u)&&!trained(d,u)) d=addDays(d,-1); while(hasLog(d,u)||trained(d,u)){ n++; d=addDays(d,-1); } return n; }

function inkOn(hex){ const n=parseInt(hex.slice(1),16); const l=(0.299*(n>>16&255)+0.587*(n>>8&255)+0.114*(n&255))/255; return l>0.72?'#000':'#fff'; }

}

function chart(W,goal,unit){
  const Wd=W.map(w=>({t:pd(w.d).getTime(), kg:w.kg})); const vals=Wd.map(p=>p.kg).concat(goal?[goal]:[]);
  let mn=Math.min(...vals), mx=Math.max(...vals); if(mx-mn<2){ const c=(mx+mn)/2; mn=c-1; mx=c+1; } mn-=0.5; mx+=0.5;
  const t0=Wd[0].t, t1=Wd[Wd.length-1].t, span=Math.max(1,t1-t0); const Wv=340,Hv=190,pl=36,pr=10,pt=14,pb=26;
  const X=t=>Wd.length===1?(pl+Wv-pr)/2:pl+(t-t0)/span*(Wv-pl-pr); const Y=v=>pt+(mx-v)/(mx-mn)*(Hv-pt-pb);
  let g=''; for(let i=0;i<=4;i++){ const v=mn+(mx-mn)*i/4; g+=`<line x1="${pl}" x2="${Wv-pr}" y1="${Y(v)}" y2="${Y(v)}" style="stroke:var(--sep)"/><text x="${pl-6}" y="${Y(v)+4}" font-size="10" text-anchor="end" style="fill:var(--muted)">${num(v,1)}</text>`; }
  const path=Wd.map((p,i)=>(i?'L':'M')+X(p.t).toFixed(1)+','+Y(p.kg).toFixed(1)).join(' ');
  const area=Wd.length>1?`<path d="${path} L${X(t1)},${Hv-pb} L${X(t0)},${Hv-pb} Z" style="fill:var(--acc)" opacity=".16"/>`:'';
  const goalL=goal?`<line x1="${pl}" x2="${Wv-pr}" y1="${Y(goal)}" y2="${Y(goal)}" style="stroke:var(--green)" stroke-dasharray="5 4" stroke-width="1.5"/><text x="${Wv-pr}" y="${Y(goal)-5}" font-size="10" text-anchor="end" style="fill:var(--green)" font-weight="700">meta ${num(goal)}</text>`:'';
  const dots=Wd.map((p,i)=>`<circle cx="${X(p.t)}" cy="${Y(p.kg)}" r="${i===Wd.length-1?4.5:3}" style="fill:var(--solid);stroke:var(--acc)" stroke-width="2.5"/>`).join('');
  const lab=Wd.length>1?`<text x="${X(t0)}" y="${Hv-8}" font-size="10" style="fill:var(--muted)">${fmtShort(W[0].d)}</text><text x="${X(t1)}" y="${Hv-8}" font-size="10" text-anchor="end" style="fill:var(--muted)">${fmtShort(W[W.length-1].d)}</text>`:`<text x="${X(t0)}" y="${Hv-8}" font-size="10" text-anchor="middle" style="fill:var(--muted)">${fmtShort(W[0].d)}</text>`;
  const lastL=`<text x="${X(t1)}" y="${Y(Wd[Wd.length-1].kg)-10}" font-size="11" font-weight="700" text-anchor="${Wd.length>1?'end':'middle'}" style="fill:var(--acc)">${num(Wd[Wd.length-1].kg)}</text>`;
  return `<svg class="chart" viewBox="0 0 ${Wv} ${Hv}" role="img" aria-label="Gráfico">${g}${area}${goalL}<path d="${path}" fill="none" style="stroke:var(--acc)" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/>${dots}${lastL}${lab}</svg>`;
}

  const {k,week,dw}=subCtx; const u=S.cur;
  if(week){ ['E','T'].filter(x=>has(ITEMS[k],x)).forEach(x=>bumpPref(x,k,name)); S.week[dw]=S.week[dw]||{}; if(name) S.week[dw][k]=name; else delete S.week[dw][k]; if(!Object.keys(S.week[dw]).length) delete S.week[dw]; }
  else { const both=$('subBoth')&&$('subBoth').checked;
    for(const x of both?[u,OTHER[u]]:[u]){ bumpPref(x,k,name); const L=dayW(S.date,x); const wk=(S.week[pd(S.date).getDay()]||{})[k]||null;
      if(name===wk) delete L.subs[k]; else L.subs[k]=name||null; if(L.subs[k]===null&&!wk) delete L.subs[k]; } }
  save(); closeSheet(); keepScroll(render); toast(name?'Troca aplicada: '+name:'Voltou ao original');
}
function exSwapSheet(w,i){
  const u=S.cur, slot=FICHAS[u].w[w].ex[i], cur=exAt(u,w,i), grp=EX[slot.e][2];
  const list=Object.entries(EX).filter(([id,e])=>e[2]===grp);
  openSheet({head:`<div class="between"><div><h2>Trocar exercício</h2><div class="muted small">Ficha ${w} · ${MUSC[grp]} · ${slot.s} × ${esc(slot.r)}</div></div>${closeBtn}</div>`,
    body:`<p class="muted xs" style="margin:0 0 10px 4px">A troca fica salva na ficha de ${USERS[u].name}. O histórico de carga é guardado por exercício.</p>`+
      list.map(([id,e])=>`<button class="opt ${id===cur?'cur':''}" data-a="pickEx" data-w="${w}" data-i="${i}" data-e="${id}"><div><div class="on">${esc(e[0])}${id===slot.e?' <span class="pill">original</span>':''}</div><div class="muted xs">${esc(e[1])}</div></div><span class="og">${id===cur?'✓':''}</span></button>`).join('')});
}
function recipeSheet(){
  openSheet({head:`<div class="between"><h2>Creme de ricota</h2>${closeBtn}</div>`,
    body:`<div class="card"><div class="gh" style="margin-top:0">Ingredientes</div><ul style="margin:0;padding-left:18px"><li>125 g de queijo ricota</li><li>1 cenoura pequena crua ralada (55 g)</li><li>30 g (2 colheres de sopa) de iogurte natural</li><li>Sal, azeite, pimenta-do-reino e cheiro-verde a gosto</li></ul>
      <div class="gh">Preparo</div><p style="margin:0">Em um recipiente, esfarele a ricota com as mãos, adicione a cenoura, o iogurte, o sal e os temperos e misture.</p>
      <div class="gh">Por 100 g</div><p class="small" style="margin:0">71 kcal · 6 g carboidratos · 10 g proteína · 1 g gordura · 1 g fibra · 58 mg sódio</p></div>
      <p class="muted xs">Rende cerca de 210 g, ~8 porções de 25 g (4 dias para os dois). Guarde na geladeira em pote fechado.</p>`});
}
let shopDays=7, shoppingText='';
const DURAVEL=/Arroz|Farinha|Leite em pó|Leite de soja em pó|Whey|Aveia|Farelo|Granola|Cereal|Biscoito|Torrada|Pipoca|Cuscuz|Cevada|Atum|Sardinha|Semente|Canela|Café(?! com leite)|própolis|Feijão|Lentilha|Grão-de-bico|Soja|em lata|Macarrão|Azeite|Óleo|Castanha|Amendoim|Noz|Avelã|Azeitona|passa|seca|Damasco|Proteína de soja/i;
function shoppingSheet(){
  const acc={}, cnts={}, N=shopDays;
  for(let i=0;i<N;i++){ const d=addDays(todayStr(),i);
    for(const u of ['E','T']) for(const it of itemsOf(u)){
      if(it.cnt){ cnts[it.cnt.u]=(cnts[it.cnt.u]||0)+it.cnt.q; continue; }
      if(!it.g||it.g[u]==null) continue;
      const sub=it.grp?subOf(it.k,u,d):null; let name=it.n, g=it.g[u], cat=it.grp?(it.grp.startsWith('hort')?'Hortaliças':GROUPS[it.grp].n):'Outros';
      if(sub){ const o=findOpt(it,g,sub); if(o){ name=o.n; g=o.g; } }
      if(it.k==='al_salada'&&!sub) name='Folhas e verduras para salada';
      const key=cat+'|'+name; acc[key]=acc[key]||{cat,name,g:0,unit:(!sub&&it.unit)||null,liquid:it.liquid&&!sub}; acc[key].g+=g; } }
  const monthly=N>7;
  let body=`<p class="muted small" style="margin-top:0">Total para os <b>próximos ${N} dias</b> (os dois), com as trocas planejadas. Pesos de arroz, frango, mandioca etc. são do alimento <b>pronto</b>; compre com folga.</p>`;
  let txt=`🛒 Lista de compras · ${monthly?'mês (30 dias)':'semana (7 dias)'} · Edésio + Tayna\n`;
  const rowsAll=Object.values(acc);
  const sections=monthly?[['📦 Compra do mês (duráveis)',rowsAll.filter(r=>DURAVEL.test(r.name)),false],['🥬 Frescos: total do mês, compre por semana',rowsAll.filter(r=>!DURAVEL.test(r.name)),true]]:[['',rowsAll,false]];
  for(const [st,rows,perWeek] of sections){ if(!rows.length) continue;
    if(st){ body+=`<div class="h3" style="font-size:17px;margin:18px 4px 2px">${st}</div>`; txt+=`\n${st.toUpperCase()}\n`; }
    const cats={}; rows.forEach(r=>{ (cats[r.cat]=cats[r.cat]||[]).push(r); });
    for(const [c,rs] of Object.entries(cats)){ body+=`<div class="gh">${esc(c)}</div><div class="card" style="padding:2px 16px">`; txt+=`\n*${c}*\n`;
      rs.sort((a,b)=>a.name.localeCompare(b.name,'pt'));
      for(const r of rs){ const q=fmtG(Math.round(r.g),r.name,r.liquid); const un=r.unit?` (≈ ${Math.ceil(r.g/r.unit[0])} ${r.unit[1]})`:'';
        const wk=perWeek?`≈ ${fmtG(Math.round(r.g*7/N/5)*5||Math.round(r.g*7/N),r.name,r.liquid)}/semana`:'';
        body+=`<div class="list-row"><span>${esc(r.name)}</span><span style="text-align:right"><b class="small">${q}${esc(un)}</b>${wk?`<div class="muted xs">${esc(wk)}</div>`:''}</span></div>`; txt+=`• ${r.name}: ${q}${un}${wk?' · '+wk:''}\n`; }
      body+=`</div>`; } }
  body+=`<div class="gh">Itens contados</div><div class="card" style="padding:2px 16px">`; txt+='\n*Itens contados*\n';
  for(const [u,q] of Object.entries(cnts)){ body+=`<div class="list-row"><span>${esc(u[0].toUpperCase()+u.slice(1))}</span><b class="small">${q}</b></div>`; txt+=`• ${u}: ${q}\n`; }
  body+=`<div class="list-row"><span>Temperos: páprica defumada, cúrcuma, cebolinha, sal</span><b class="small">a gosto</b></div></div>`;
  txt+='• Temperos (páprica defumada, cúrcuma, cebolinha, sal): a gosto\n';
  body+=`<button class="btn full" data-a="copyList">Copiar / compartilhar lista</button>`; shoppingText=txt;
  openSheet({head:`<div class="between"><h2>Lista de compras</h2>${closeBtn}</div><div class="tabs2" style="margin:12px 0 0"><button class="${N===7?'on':''}" data-a="shopP" data-n="7">Semanal</button><button class="${N===30?'on':''}" data-a="shopP" data-n="30">Mensal</button></div>`, body});
}
function copyDaySheet(dw){
  const order=[1,2,3,4,5,6,0].filter(x=>x!==dw);
  openSheet({head:`<div class="between"><h2>Copiar ${DOW[dw].toLowerCase()} para…</h2>${closeBtn}</div>`,
    body:order.map(x=>`<label class="toggle"><input type="checkbox" class="cpd" value="${x}"> ${DOW[x]}</label>`).join('')+`<button class="btn full" data-a="doCopy" data-w="${dw}">Copiar</button>`});
}

/* ---------- cronômetro de descanso ---------- */
const TM={end:0,tot:0,iv:null};
const mmss=s=>Math.floor(s/60)+':'+String(s%60).padStart(2,'0');
function startTimer(sec){ TM.end=Date.now()+sec*1000; TM.tot=sec; clearInterval(TM.iv); TM.iv=setInterval(tick,250); tick(); }
function stopTimer(){ TM.end=0; clearInterval(TM.iv); $('timer').classList.remove('show'); }
function tick(){ const el=$('timer'); if(!TM.end){ el.classList.remove('show'); return; }
  const left=Math.max(0,Math.ceil((TM.end-Date.now())/1000)); el.classList.add('show'); el.querySelector('b').textContent=mmss(left); el.querySelector('i').style.width=(left/TM.tot*100)+'%';
  if(left<=0){ stopTimer(); try{ navigator.vibrate&&navigator.vibrate([250,120,250]); }catch(e){} toast('Descanso concluído 💪 Próxima série!'); } }

/* =========================================================
   AÇÕES
   ========================================================= */
const A = {
  theme(el){ S.theme=el.dataset.t; save(); keepScroll(render); },
  accent(el){ S.users[el.dataset.u].accent=el.dataset.c; save(); keepScroll(render); },
  user(el){ S.cur=el.dataset.u; save(); render(); window.scrollTo(0,0); },
  tab(el){ S.tab=el.dataset.t; save(); render(); window.scrollTo(0,0); },
  day(el){ S.date=addDays(S.date,Number(el.dataset.n)); if(S.date>todayStr()) S.date=todayStr(); render(); },
  today(){ S.date=todayStr(); render(); },
  goDay(el){ S.date=el.dataset.d; S.tab='hoje'; save(); render(); window.scrollTo(0,0); },
  chk(el){ const L=dayW(S.date,S.cur); const k=el.dataset.k; if(L.checks[k]) delete L.checks[k]; else L.checks[k]=true; save(); keepScroll(render); },
  mealAll(el){ const ml=MEALS.find(m=>m.id===el.dataset.m); const L=dayW(S.date,S.cur); const its=ml.secs.flatMap(s=>s.it).filter(it=>has(it,S.cur));
    const all=its.every(it=>L.checks[it.k]); its.forEach(it=>{ if(all) delete L.checks[it.k]; else L.checks[it.k]=true; }); save(); keepScroll(render); },
  water(el){ const L=dayW(S.date,S.cur); L.water=Math.max(0,(L.water||0)+Number(el.dataset.n)); save(); keepScroll(render); },
  openSub(el){ openSub(el.dataset.k, el.dataset.w); },
  pickSub(el){ pickSub(el.dataset.n); },
  closeSheet(){ closeSheet(); },
  recipe(){ recipeSheet(); },
  shopping(){ shoppingSheet(); },
  shopP(el){ shopDays=Number(el.dataset.n); shoppingSheet(); },
  async copyList(){ try{ if(navigator.share){ await navigator.share({text:shoppingText}); return; } }catch(e){ if(e.name==='AbortError') return; }
    try{ await navigator.clipboard.writeText(shoppingText); toast('Lista copiada'); }catch(e){ toast('Não foi possível copiar'); } },
  autoWeek(){
    if(!anyPrefs()){ toast('Faça algumas trocas primeiro para o app aprender'); return; }
    if(Object.keys(S.week).length && !confirm('Sugerir a semana com as preferências? As trocas planejadas atuais serão substituídas.')) return;
    const order=[1,2,3,4,5,6,0], week={}, starUsed={}; let n=0;
    for(const it of Object.values(ITEMS).filter(i=>i.grp)){
      const cand=favs(['E','T'].filter(x=>has(it,x)),it.k,3).map(([f])=>f).filter(f=>findOpt(it,100,f)); if(!cand.length) continue;
      const seq=['',...cand];
      order.forEach((dw,i)=>{ let f=seq[i%seq.length]; const o=f&&findOpt(it,100,f); if(o&&o.s){ if(starUsed[f]) f=''; else starUsed[f]=1; } if(f){ (week[dw]=week[dw]||{})[it.k]=f; n++; } });
    }
    S.week=week; save(); render(); toast(n?'Semana sugerida com '+n+' trocas preferidas':'Ainda não há preferências suficientes');
  },
  cview(el){ cozView=el.dataset.t; render(); },
  clearDay(el){ delete S.week[el.dataset.w]; save(); keepScroll(render); toast('Trocas do dia removidas'); },
  clearWeek(){ if(confirm('Remover todas as trocas planejadas da semana?')){ S.week={}; save(); render(); } },
  copyDay(el){ copyDaySheet(Number(el.dataset.w)); },
  doCopy(el){ const src=S.week[el.dataset.w]||{}; const sel=[...document.querySelectorAll('.cpd:checked')].map(i=>i.value);
    if(!sel.length){ toast('Selecione pelo menos um dia'); return; }
    sel.forEach(x=>{ if(Object.keys(src).length) S.week[x]={...src}; else delete S.week[x]; }); save(); closeSheet(); render(); toast('Trocas copiadas'); },
  // treino
  tview(el){ trainView=el.dataset.t; render(); },
  pickW(el){ const s=sessW(todayStr(),S.cur); s.w=el.dataset.w; s.cardio=null; save(); keepScroll(render); },
  tset(el){ const s=sessW(todayStr(),S.cur); const ex=el.dataset.ex, i=Number(el.dataset.i); s.sets[ex]=s.sets[ex]||[]; const z=s.sets[ex][i]=s.sets[ex][i]||{};
    z.ok=!z.ok;
    if(z.ok){ const last=lastPerf(S.cur,ex,todayStr()); const lz=last&&last.sets[i];
      if(z.kg==null||z.kg==='') z.kg = lz&&lz.kg ? lz.kg : (s.sets[ex][i-1]&&s.sets[ex][i-1].kg) || '';
      if(z.r==null||z.r==='') z.r = el.dataset.tr || '';
      startTimer(Number(el.dataset.rs)||75); }
    save(); keepScroll(render); },
  exSwap(el){ exSwapSheet(el.dataset.w, Number(el.dataset.i)); },
  pickEx(el){ const u=S.cur, w=el.dataset.w, i=el.dataset.i, e=el.dataset.e; S.tswap[u][w]=S.tswap[u][w]||{};
    if(e===FICHAS[u].w[w].ex[i].e) delete S.tswap[u][w][i]; else S.tswap[u][w][i]=e; save(); closeSheet(); keepScroll(render); toast('Exercício trocado: '+EX[e][0]); },
  tipT(el){ const ex=el.dataset.ex; openTips.has(ex)?openTips.delete(ex):openTips.add(ex); keepScroll(render); },
  cardioPick(el){ const s=sessW(todayStr(),S.cur); const W=FICHAS[S.cur].w[s.w]; s.cardio=Object.assign({id:W.c[0],min:W.c[1],ok:false}, s.cardio||{}, {id:el.dataset.c}); save(); keepScroll(render); },
  cardioOk(){ const s=sessW(todayStr(),S.cur); const W=FICHAS[S.cur].w[s.w]; s.cardio=Object.assign({id:W.c[0],min:W.c[1],ok:false}, s.cardio||{}); const m=pnum($('cardioMin')&&$('cardioMin').value); if(m) s.cardio.min=m; s.cardio.ok=!s.cardio.ok; save(); keepScroll(render); },
  finishT(){ const s=sessW(todayStr(),S.cur); s.done=!s.done; if(s.done){ s.at=Date.now(); stopTimer(); } save(); keepScroll(render); toast(s.done?'Treino concluído! 💪':'Treino reaberto'); },
  tAdd(){ if(TM.end){ TM.end+=15000; TM.tot+=15; tick(); } },
  tStop(){ stopTimer(); },
  // evolução
  evolTab(el){ evolTab=el.dataset.t; render(); },
  saveW(){ const d=$('wDate').value; const kg=pnum($('wKg').value);
    if(!d){ toast('Informe a data'); return; } if(!(kg>20&&kg<300)){ toast('Informe um peso válido'); return; }
    const arr=S.weights[S.cur].filter(w=>w.d!==d); arr.push({d,kg:Math.round(kg*10)/10}); S.weights[S.cur]=arr; save(); render(); toast('Peso registrado'); },
  delW(el){ if(!confirm('Excluir este registro de peso?')) return; S.weights[S.cur]=S.weights[S.cur].filter(w=>w.d!==el.dataset.d); save(); keepScroll(render); },
  saveM(){ const d=$('mDate').value; if(!d){ toast('Informe a data'); return; } const v={};
    document.querySelectorAll('[data-meas]').forEach(i=>{ const n=pnum(i.value); if(n&&n>5&&n<250) v[i.dataset.meas]=Math.round(n*10)/10; });
    if(!Object.keys(v).length){ toast('Preencha pelo menos uma medida'); return; }
    const arr=S.meas[S.cur]; const ex=arr.find(m=>m.d===d); if(ex) Object.assign(ex.v,v); else arr.push({d,v}); save(); render(); toast('Medidas salvas'); },
  delM(el){ if(!confirm('Excluir as medidas deste dia?')) return; S.meas[S.cur]=S.meas[S.cur].filter(m=>m.d!==el.dataset.d); save(); keepScroll(render); },
  measChart(el){ measSel=el.dataset.k||null; keepScroll(render); },
  // dados
  export(){ const data=JSON.stringify({app:'nossaDieta',v:3,exported:new Date().toISOString(),data:S});
    const blob=new Blob([data],{type:'application/json'}); const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='nossa-dieta-backup-'+todayStr()+'.json';
    document.body.appendChild(a); a.click(); setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},500); S.lastBackup=Date.now(); save(); keepScroll(render); toast('Backup exportado'); },
  import(){ $('impFile').click(); },
  reset(){ if(confirm('Apagar TODOS os registros, pesos, medidas, treinos e trocas deste aparelho? Faça um backup antes.') && confirm('Tem certeza? Não dá para desfazer.')){ localStorage.removeItem(KEY); S=DEF(); S.date=todayStr(); render(); toast('Dados apagados'); } }
};

document.addEventListener('click', e=>{ const el=e.target.closest('[data-a]'); if(!el) return; const f=A[el.dataset.a]; if(f){ e.preventDefault(); f(el,e); } });
document.addEventListener('input', e=>{
  const t=e.target;
  if(t.id==='subQ'&&subCtx){ subCtx.q=t.value; $('pb').innerHTML=subList(); }
  if(t.id==='dayNote'){ dayW(S.date,S.cur).note=t.value; save(); }
  if(t.dataset&&t.dataset.tin){ const s=sessW(todayStr(),S.cur); const ex=t.dataset.ex, i=Number(t.dataset.i); s.sets[ex]=s.sets[ex]||[]; const z=s.sets[ex][i]=s.sets[ex][i]||{}; z[t.dataset.tin]=t.value.replace(',','.'); save(); }
  if(t.id==='cardioMin'){ const s=sessW(todayStr(),S.cur); const W=FICHAS[S.cur].w[s.w]; s.cardio=Object.assign({id:W.c[0],min:W.c[1],ok:false}, s.cardio||{}); s.cardio.min=pnum(t.value)||0; save(); }
});
document.addEventListener('change', e=>{
  const t=e.target;
  if(t.dataset&&t.dataset.set){ const u=t.dataset.u,k=t.dataset.set; const v=pnum(t.value); S.users[u][k]=(v>0)?(k==='goal'?Math.round(v*10)/10:Math.round(v)):null; save(); toast('Salvo'); }
  if(t.id==='impFile'&&t.files[0]){ const r=new FileReader(); r.onload=()=>{ try{ const j=JSON.parse(r.result); const d=j.data||j; if(!d.log||!d.weights) throw 0;
      if(!confirm('Substituir os dados deste aparelho pelos do backup?')) return; localStorage.setItem(KEY, JSON.stringify(d)); location.reload(); }catch(err){ toast('Arquivo de backup inválido'); } }; r.readAsText(t.files[0]); t.value=''; }
});
document.addEventListener('keydown', e=>{ if(e.key==='Escape') closeSheet(); });
let lastToday=todayStr();
document.addEventListener('visibilitychange', ()=>{ if(!document.hidden && todayStr()!==lastToday){ if(S.date===lastToday) S.date=todayStr(); lastToday=todayStr(); render(); } });

render();
